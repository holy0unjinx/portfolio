<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Multi Search Prototype</title>
    <style>
      body {
        margin: 0;
        background: #0f0f0f;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
      }

      /* 중앙 키워드 */
      .center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 30px;
        background: #222;
        border-radius: 50px;
        cursor: pointer;
        z-index: 10;
      }

      /* 검색 플랫폼 노드 */
      .platform {
        position: absolute;
        width: 110px;
        padding: 10px;
        background: #333;
        border-radius: 10px;
        text-align: center;
      }

      .p1 {
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
      }
      .p2 {
        top: 50%;
        left: 15%;
        transform: translateY(-50%);
      }
      .p3 {
        top: 50%;
        right: 15%;
        transform: translateY(-50%);
      }

      /* 결과 영역 */
      .results {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 35%;
        background: #111;
        padding: 15px;
        display: none;
      }

      .layer {
        background: #1e1e1e;
        margin-bottom: 10px;
        padding: 10px;
        border-left: 4px solid #666;
      }
    </style>
  </head>
  <body>
    <div class="center" onclick="showResults()">🔍 검색 키워드</div>

    <div class="platform p1">Google</div>
    <div class="platform p2">Naver</div>
    <div class="platform p3">Bing</div>

    <div class="results" id="results">
      <div class="layer">Google 결과 1 · 2 · 3</div>
      <div class="layer">Naver 결과 A · B · C</div>
      <div class="layer">Bing 결과 α · β · γ</div>
    </div>

    <script>
      function showResults() {
        document.getElementById("results").style.display = "block";
      }
    </script>
  </body>
</html>
