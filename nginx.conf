server {
    listen 80;
    server_name shxin.kr;
    root /var/www/portfolio;
    index index.html;
    include /etc/nginx/mime.types;

    error_page 404 /HTML/404.html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    # Preserve existing links while using one public URL per page.
    location ~ ^/(?:HTML/)?(portfolio|archive|contact|credits|login|register)\.html$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/(portfolio|archive|contact|credits|login|register)/$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/(portfolio|archive|contact|credits|login|register)$ {
        try_files /HTML/$1.html =404;
    }

    location ^~ /assets/ {
        root /var/www/portfolio/HTML;
        try_files $uri =404;
    }

    location ^~ /HTML/assets/ {
        try_files $uri =404;
    }

    location ~ ^/(CSS|JS)/ {
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /HTML/404.html {
        internal;
    }

    location / {
        return 404;
    }
}
