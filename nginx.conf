server {
    listen 80;
    server_name shxin.kr;
    root /var/www/portfolio;
    index index.html;
    include /etc/nginx/mime.types;

    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/xml image/svg+xml;
    # Unversioned assets must revalidate so deployments remain immediately visible.
    add_header Cache-Control "public, max-age=0, must-revalidate";

    error_page 404 /HTML/404.html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    # Preserve existing links while using one public URL per page.
    location ~ ^/(?:HTML/)?(portfolio|archive|contact|credits|login|register|success)\.html$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/(portfolio|archive|contact|credits|login|register|success)/$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/(portfolio|archive|contact|credits|login|register|success)$ {
        try_files /HTML/$1.html =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=86400";
        root /var/www/portfolio/HTML;
        try_files $uri =404;
    }

    location ^~ /HTML/assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~ ^/(CSS|JS)/ {
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /HTML/404.html {
        internal;
    }

    location / {
        return 404;
    }
}
