<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="stylesheet" href="../CSS/contact.css" />
    <title>Contact</title>
    <script src="./JS/fakedrag.js" defer></script>
  </head>
  <body class="serif">
    <header>
      <h1 class="gothic">Contact</h1>
      <a href="../index.html"
        ><svg
          width="57"
          height="57"
          viewBox="0 0 57 57"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M3.50001 53.5L53.5 3.5M53.5 53.5L53.5 3.5L3.5 3.50001"
            stroke-width="7"
            stroke-linecap="round"
            stroke="black"
          />
        </svg>
      </a>
    </header>
    <div class="container">
      <div id="content">
        <section id="social">
          <div class="section-title">
            <h1>Social</h1>
          </div>
          <div class="section-container">
            <ul>
              <li>Github</li>
              <li><a href="https://github.com/holy0unjinx">holy0unjinx</a></li>
            </ul>
            <ul>
              <li>Discord</li>
              <li><a href="https://discord.gg/AZWsZNsD">tls0x29a</a></li>
            </ul>
          </div>
        </section>
        <section id="email">
          <div class="section-title">
            <h1>Email</h1>
          </div>
          <div class="section-container">
            <a href="mailto:hello@shxin.kr">
              <ul>
                <li>hello</li>
                <li>@shxin.kr</li>
              </ul>
            </a>
          </div>
        </section>
      </div>

      <form id="contact">
        <input type="text" name="title" id="title-input" placeholder="Title" />
        <input
          type="email"
          name="email"
          id="email-input"
          placeholder="Email"
          autocomplete="email"
        />
        <textarea
          name="content"
          id="contant-input"
          placeholder="Lorem Ipsum"
        ></textarea>

        <footer>
          <input type="submit" value="Submit" />
          <a href="./credits.html">Credits ></a>
        </footer>
      </form>
    </div>
  </body>
</html>
