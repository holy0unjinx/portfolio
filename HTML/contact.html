<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get in touch via my social media, email, or contact form."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Portfolio" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Contact - 신성은진" />
    <meta
      property="og:description"
      content="Get in touch via my social media, email, or contact form."
    />
    <meta property="og:url" content="https://shxin.kr/contact" />
    <meta
      property="og:image"
      content="https://shxin.kr/assets/og/contact.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Contact" />
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="stylesheet" href="../CSS/contact.css" />
    <link
      rel="shortcut icon"
      href="./assets/favicon.webp?v=2"
      type="image/webp"
    />
    <title>Contact</title>
    <script src="../JS/fakedrag.js" defer></script>
  </head>
  <body class="serif">
    <header>
      <h1 class="gothic">Contact</h1>
      <a href="../index.html"
        ><svg
          width="57"
          height="57"
          viewBox="0 0 57 57"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M3.50001 53.5L53.5 3.5M53.5 53.5L53.5 3.5L3.5 3.50001"
            stroke-width="7"
            stroke-linecap="round"
            stroke="black"
          />
        </svg>
      </a>
    </header>
    <main class="container">
      <aside id="content">
        <section id="social">
          <div class="section-title">
            <h1>Social</h1>
          </div>
          <div class="section-container">
            <ul>
              <li>Github</li>
              <li><a href="https://github.com/holy0unjinx">holy0unjinx</a></li>
            </ul>
            <ul>
              <li>Discord</li>
              <li><a href="https://discord.gg/AZWsZNsD">tls0x29a</a></li>
            </ul>
            <ul>
              <li>Instagram</li>
              <li>
                <a href="https://www.instagram.com/holy_unjinx">@holy_unjinx</a>
              </li>
            </ul>
          </div>
        </section>
        <section id="email">
          <div class="section-title">
            <h1>Email</h1>
          </div>
          <div class="section-container">
            <a href="mailto:hello@shxin.kr">
              <ul>
                <li>hello</li>
                <li>@shxin.kr</li>
              </ul>
            </a>
          </div>
        </section>
      </aside>

      <form
        id="contact"
        action="https://api.web3forms.com/submit"
        method="POST"
      >
        <input
          type="hidden"
          name="access_key"
          value="c4753187-a286-434f-860f-ddd34be60891"
        />
        <input type="hidden" name="redirect" value="https://shxin.kr/success" />
        <input
          type="checkbox"
          name="botcheck"
          style="display: none"
          tabindex="-1"
        />
        <input
          type="text"
          name="subject"
          id="title-input"
          placeholder="Title"
          aria-label="Title"
          required
        />
        <input
          type="email"
          name="email"
          id="email-input"
          placeholder="Email"
          autocomplete="email"
          aria-label="Email"
          required
        />
        <textarea
          name="message"
          id="contant-input"
          placeholder="Lorem Ipsum"
          aria-label="Message"
          required
        ></textarea>

        <footer>
          <input type="submit" value="Submit" />
          <a href="./credits.html">Credits ></a>
        </footer>
      </form>
    </main>
  </body>
</html>
