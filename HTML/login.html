<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="로그인 페이지(테스트)" />
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="stylesheet" href="../CSS/login.css" />
    <link
      rel="shortcut icon"
      href="./assets/favicon.webp?v=2"
      type="image/webp"
    />
    <title>Login</title>
    <script src="../JS/fakedrag.js" defer></script>
    <script src="../JS/robot.js" defer></script>
  </head>
  <body>
    <header>
      <h1 class="serif">Login</h1>
    </header>
    <form action="../index.html">
      <main id="contents">
        <input
          type="text"
          id="id"
          placeholder="아이디를 입력해주세요."
          required
        /><br />
        <input
          type="password"
          id="pw"
          placeholder="비밀번호를 입력해주세요."
          required
        />
      </main>
      <footer>
        <a href="./register.html">계정이 없으신가요?</a><br />
        <input type="submit" />
      </footer>
    </form>
  </body>
</html>
